AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  raincheck serverless stack: one S3 bucket (SPA + data), an ARM64 Lambda
  (FastAPI via Mangum) behind a Function URL, CloudFront in front of both,
  DynamoDB for saved shapes, Cognito for auth, and an EventBridge warm ping.
  Deployed idempotently by ./deploy_infra.sh — run that, not this file, so the
  origin-verify secret and the Cognito callback two-pass are handled for you.

# Cost profile (light traffic): CloudFront+S3 pennies, Lambda in free tier or
# ~$1-2/mo with the 5-min warm ping, DynamoDB on-demand pennies, Cognito
# ESSENTIALS free < 10k MAU. No NAT, no ALB, no Fargate, no ECR.

Parameters:
  BucketName:
    Type: String
    Default: ''
    Description: >-
      S3 bucket for the SPA + all data. Leave empty to auto-name
      <stack>-static-<account-id>. Must not already exist (CloudFormation
      creates and owns it).
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Shared secret CloudFront attaches as x-origin-verify on /api/* origin
      requests; the Lambda 403s anything without it (the Function URL itself
      is public because OAC cannot sign browser POST bodies). Managed in SSM
      by deploy_infra.sh — do not pass by hand.
  LambdaMemoryMb:
    Type: Number
    Default: 1024
    Description: >-
      1 GB fits the working set comfortably: a typical stats query touches
      1-15 MB of bins and the LRU caches are bounded (~100 MB at steady state).
  LambdaTimeoutSec:
    Type: Number
    Default: 30
  PythonRuntime:
    Type: String
    Default: python3.12
  WarmPing:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      rate(5 minutes) EventBridge ping ({"warm": true}) keeps one execution
      environment resident so interactive queries usually skip the ~2-4 s cold
      start. ~9k invocations/mo — within the Lambda free tier.
  AppCallbackDomain:
    Type: String
    Default: ''
    Description: >-
      CloudFront domain for the Cognito OAuth callback URL. Unknown before the
      first deploy, so deploy_infra.sh fills it in automatically on a second
      pass. Only used when the stack creates the user pool.
  LogRetentionDays:
    Type: Number
    Default: 30
  # ── Reuse existing resources (e.g. keeping the current account's users) ──
  ExistingUserItemsTable:
    Type: String
    Default: ''
    Description: Name of an existing DynamoDB user-items table (same region). Empty = create one.
  ExistingUserPoolId:
    Type: String
    Default: ''
    Description: Existing Cognito user pool ID. Empty = create pool + client + domain.
  ExistingUserPoolClientId:
    Type: String
    Default: ''
  ExistingCognitoOauthBaseUrl:
    Type: String
    Default: ''
    Description: Hosted UI base URL of the existing pool's domain (https://... no trailing slash).

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, '']]
  CreateUserItemsTable: !Equals [!Ref ExistingUserItemsTable, '']
  CreateUserPool: !Equals [!Ref ExistingUserPoolId, '']
  HasCallbackDomain: !And
    - !Condition CreateUserPool
    - !Not [!Equals [!Ref AppCallbackDomain, '']]
  WarmPingEnabled: !Equals [!Ref WarmPing, 'true']

Resources:
  # ── Storage ─────────────────────────────────────────────────────────
  StaticBucket:
    Type: AWS::S3::Bucket
    # Holds the SPA and every exported data artifact; survive stack deletion
    # so a teardown can't destroy hours of recompute output.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasBucketName
        - !Ref BucketName
        - !Sub '${AWS::StackName}-static-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  UserItemsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateUserItemsTable
    # User data — never delete with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-user-items'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── Cognito (created only when no existing pool is supplied) ────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateUserPool
    # User accounts — never delete with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: ESSENTIALS
      MfaConfiguration: 'OFF'
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CreateUserPool
    Properties:
      # Globally unique; stack names are constrained to lowercase by
      # deploy_infra.sh (also required for the auto-named bucket).
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateUserPool
    Properties:
      ClientName: !Sub '${AWS::StackName}-spa'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, phone]
      # The CloudFront domain doesn't exist until the distribution is created,
      # so first pass ships localhost-only and deploy_infra.sh re-deploys with
      # AppCallbackDomain=<distribution domain> (fast, client-only update).
      CallbackURLs: !If
        - HasCallbackDomain
        - ['http://localhost:5173/', !Sub 'https://${AppCallbackDomain}/']
        - ['http://localhost:5173/']
      LogoutURLs: !If
        - HasCallbackDomain
        - ['http://localhost:5173/', !Sub 'https://${AppCallbackDomain}/']
        - ['http://localhost:5173/']

  # ── API Lambda ──────────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadStaticData
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${StaticBucket.Arn}/*'
              - Sid: ListStaticData
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt StaticBucket.Arn
              - Sid: UserItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !If
                  - CreateUserItemsTable
                  - !GetAtt UserItemsTable.Arn
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingUserItemsTable}'

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: raincheck stats API (FastAPI via Mangum). Code shipped by deploy_api.sh.
      Role: !GetAtt ApiRole.Arn
      Runtime: !Ref PythonRuntime
      Architectures: [arm64]
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref LambdaTimeoutSec
      Handler: backend.lambda_handler.handler
      # Placeholder only. The handler above resolves after ./deploy_api.sh
      # pushes the real zip; until then invocations fail with an import error
      # (surfaces as 502 from CloudFront). NEVER edit this inline text after
      # the first deploy: any change makes CloudFormation push it as new code,
      # clobbering the deployed zip.
      Code:
        ZipFile: |
          # raincheck-api placeholder — run ./deploy_api.sh to deploy the code.
          def handler(event, context):
              raise RuntimeError("run ./deploy_api.sh to deploy the API code")
      Environment:
        Variables:
          DATA_S3_URI: !Sub 's3://${StaticBucket}/model_data'
          DYNAMODB_USER_ITEMS_TABLE: !If
            - CreateUserItemsTable
            - !Ref UserItemsTable
            - !Ref ExistingUserItemsTable
          COGNITO_USER_POOL_ID: !If [CreateUserPool, !Ref UserPool, !Ref ExistingUserPoolId]
          COGNITO_APP_CLIENT_ID: !If [CreateUserPool, !Ref UserPoolClient, !Ref ExistingUserPoolClientId]
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_DOMAIN_PREFIX: !If [CreateUserPool, !Sub '${AWS::StackName}-${AWS::AccountId}', '']
          COGNITO_OAUTH_BASE_URL: !If [CreateUserPool, '', !Ref ExistingCognitoOauthBaseUrl]
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          # Preload each model's grid.json on cold start (4 tiny S3 reads).
          WARM_CACHE: '1'

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  WarmRule:
    Type: AWS::Events::Rule
    Condition: WarmPingEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-api-warm'
      Description: Keep one raincheck-api execution environment warm.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: warm-api
          Arn: !GetAtt ApiFunction.Arn
          Input: '{"warm": true}'

  WarmRulePermission:
    Type: AWS::Lambda::Permission
    Condition: WarmPingEnabled
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmRule.Arn

  # ── CloudFront ──────────────────────────────────────────────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName}: SPA + data from S3, /api/* to Lambda'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-static
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api-lambda
            # FunctionUrl is https://<id>.lambda-url.<region>.on.aws/ — take the host.
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: s3-static
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized: honors the Cache-Control set at upload
          # (deploy_static.sh / deploy_frontend.sh), gzip+brotli enabled.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: api-lambda
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed CachingDisabled + AllViewerExceptHostHeader (a Function
            # URL origin must receive its own Host header, not the viewer's).
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Value: !Ref StaticBucket
  DataS3Uri:
    Description: Value for DATA_S3_URI (stats prefix; forecast/ and site assets are derived from it).
    Value: !Sub 's3://${StaticBucket}/model_data'
  ApiFunctionName:
    Value: !Ref ApiFunction
  ApiFunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  UserPoolId:
    Value: !If [CreateUserPool, !Ref UserPool, !Ref ExistingUserPoolId]
  UserPoolClientId:
    Value: !If [CreateUserPool, !Ref UserPoolClient, !Ref ExistingUserPoolClientId]
  CognitoDomainPrefix:
    Value: !If [CreateUserPool, !Sub '${AWS::StackName}-${AWS::AccountId}', '']
  CognitoOauthBaseUrl:
    Value: !If
      - CreateUserPool
      - !Sub 'https://${AWS::StackName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
      - !Ref ExistingCognitoOauthBaseUrl
  UserItemsTableName:
    Value: !If [CreateUserItemsTable, !Ref UserItemsTable, !Ref ExistingUserItemsTable]
